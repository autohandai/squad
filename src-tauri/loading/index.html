<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Autohand Squad</title>
<style>
  :root { color-scheme: light dark; --fg: #111; --muted: #6b6b6b; --bg: #fff; --line: #e6e6e6; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f2f2f2; --muted: #9a9a9a; --bg: #0b0b0b; --line: #262626; } }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif; }
  main { min-height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
  .card { width: min(28rem, 100%); }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .dot { width: 10px; height: 10px; border-radius: 999px; background: var(--fg); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
  .steps { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; font-size: 13px; color: var(--muted); }
  .steps li { margin: 4px 0; }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="row"><span class="dot" aria-hidden="true"></span><h1>Starting Autohand Squad</h1></div>
    <p id="status">Checking the local runtime…</p>
    <ul class="steps">
      <li>Preflight: state directory, bundled runtime, free ports</li>
      <li>Starting the daemon and the web bridge</li>
      <li>Waiting for the bridge to answer</li>
    </ul>
  </div>
</main>
</body>
</html>
