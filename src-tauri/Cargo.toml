[package]
name = "autohand-squad-desktop"
version = "0.1.7"
description = "Autohand Squad desktop shell (Tauri 2)"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "autohand-squad"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
autohand_squad_runtime = { package = "autohand-squad-runtime", path = "../daemon" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tokio = { version = "1.41", features = ["rt-multi-thread"] }
window-vibrancy = "0.8"
reqwest = { version = "0.13", features = ["blocking", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
getrandom = "0.3"
libc = "0.2"
sha2 = "0.10"
objc2-app-kit = "0.3"
base64 = "0.23"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-user-notifications = { version = "0.3", features = ["block2"] }
block2 = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
